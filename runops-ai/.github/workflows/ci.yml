name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: runops
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B -DskipTests package --file runops-ai/pom.xml

      - name: Run tests
        run: mvn -B test --file runops-ai/pom.xml
        env:
          DB_URL: jdbc:postgresql://localhost:5432/runops
          DB_USER: postgres
          DB_PASSWORD: postgres

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: runops-ai-jar
          path: runops-ai/target/*.jar