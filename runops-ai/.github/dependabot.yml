version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/runops-ai"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "maven"

  - package-ecosystem: "docker"
    directory: "/runops-ai"
    schedule:
      interval: "monthly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"